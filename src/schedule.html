<!DOCTYPE html>
<html>
  <head>
    <title>F1 Navbar</title>
    <link rel="stylesheet" href="main.css" />

    <link href="./output.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="bg-gray-900" x-data="{ isOpen: false }">
      <div class="px-4 sm:px-6 lg:px-8">
        <div class="relative flex h-16 items-center justify-between w-100">
          <div class="flex flex-shrink-0 items-center">
            <a href="#">
              <img
                class="h-8 w-auto"
                src="https://upload.wikimedia.org/wikipedia/commons/3/33/F1.svg"
                alt="F1 Logo"
              />
            </a>
          </div>

          <div class="absolute inset-y-0 right-0 flex items-center lg:hidden">
            <button
              @click="isOpen = !iAsOpen"
              type="button"
              class="inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white"
              aria-controls="mobile-menu"
              aria-expanded="false"
            >
              <span class="sr-only">Open main menu</span>
              <svg
                x-show="!isOpen"
                class="block h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                />
              </svg>
              <svg
                x-show="isOpen"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>

          <div class="hidden lg:ml-6 lg:block">
            <div class="flex items-center space-x-4">
              <a
                href="index.html"
                class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                >Home</a
              >
              <a
                href="teams.html"
                class="rounded-md bg-gray-800 px-3 py-2 text-sm font-medium text-white"
                aria-current="page"
                >Drivers & Teams</a
              >
              <a
                href="schedule.html"
                class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                >Schedule</a
              >
              <a
                href="#"
                class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                >Feedback</a
              >
              <a
                href="#"
                class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                >View cars</a
              >
            </div>
          </div>
        </div>
      </div>

      <div x-show="isOpen" class="lg:hidden" id="mobile-menu">
        <div class="space-y-1 px-2 pb-3 pt-2">
          <a
            href="index.html"
            class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >Home</a
          >
          <a
            href="teams.html"
            class="block rounded-md bg-gray-800 px-3 py-2 text-base font-medium text-white"
            aria-current="page"
            >Drivers & Teams</a
          >
          <a
            href="#"
            class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >Schedule</a
          >
          <a
            href="#"
            class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >Feedback</a
          >
          <a
            href="#"
            class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >View cars</a
          >
        </div>
      </div>
    </nav>
    <div class="text-center text-3xl f1-b my-9 lg:my-11">2025 FIA FORMULA ONE WORLD 
CHAMPIONSHIP™ RACE CALENDAR</div>

<div id="animation-carousel" class="relative w-full" data-carousel="slide">
    <!-- Carousel wrapper -->
    <div class="relative h-56 overflow-hidden rounded-lg md:h-96">
         <!-- Item 1 -->
        <div class="hidden duration-200 ease-linear" data-carousel-item="active">
            <img src="/asssets/f1-netherlands.jpg" class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2" alt="...">
        </div>
        <!-- Item 2 -->
        <div class="hidden duration-200 ease-linear" data-carousel-item="hidden">
            <img src="/asssets/f1-italy.jpg" class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2" alt="...">
        </div>
        <!-- Item 3 -->
        <div class="hidden duration-200 ease-linear" data-carousel-item="hidden">
            <img src="/asssets/f1-australia.jpg" class="absolute block w-full -translate-x-1/2 -translate-y-1/2 top-1/2 left-1/2" alt="...">
        </div>
       
    <!-- Slider controls -->
    <button type="button" class="absolute top-0 start-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-prev>
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
            <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 1 1 5l4 4"/>
            </svg>
            <span class="sr-only">Previous</span>
        </span>
    </button>
    <button type="button" class="absolute top-0 end-0 z-30 flex items-center justify-center h-full px-4 cursor-pointer group focus:outline-none" data-carousel-next>
        <span class="inline-flex items-center justify-center w-10 h-10 rounded-full bg-white/30 dark:bg-gray-800/30 group-hover:bg-white/50 dark:group-hover:bg-gray-800/60 group-focus:ring-4 group-focus:ring-white dark:group-focus:ring-gray-800/70 group-focus:outline-none">
            <svg class="w-4 h-4 text-white dark:text-gray-800 rtl:rotate-180" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 6 10">
                <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 9 4-4-4-4"/>
            </svg>
            <span class="sr-only">Next</span>
        </span>
    </button>
</div>


    <div class="bg-#000 min-h-screen flex items-center justify-start">
  <div class="text-white ml-16 mb-40">
    <h2 class="text-lg font-bold mb-3">Next</h2>
    <div class="relative border-4 rounded-md overflow-hidden w-80">
      <!-- Background Image -->
      <img src="/asssets/f1-netherlands.jpg" alt="Race Car" class="w-full h-40 object-cover">

      <!-- Overlay text -->
      <div class="absolute inset-0 flex flex-col justify-between p-3">
        <p class="text-sm font-semibold">Round 15</p>
        <div>
          <p class="text-md font-bold">Netherlands</p>
          <p class="text-sm font-semibold">29-31 August</p>
        </div>
      </div>
    </div>
  </div>
</div>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/flowbite/2.2.1/flowbite.min.js"></script>

  </body>
</html>
