<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>F1 Central | Create Account</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="output.css" />
    <link rel="stylesheet" href="main.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: f1-b;
      }
    </style>
  </head>
  <body class="bg-gray-900">
    <!-- Page container -->
    <div
      class="container mx-auto px-4 py-12 flex justify-center min-h-screen items-center"
    >
      <!-- Card -->
      <div
        class="w-full max-w-lg bg-gray-800 border border-gray-700 shadow-2xl rounded-2xl p-6 sm:p-10 relative overflow-hidden"
      >
        <div class="absolute top-0 left-0 h-2 w-full bg-red-600"></div>

        <!-- Form Header -->
        <div class="text-center mb-8">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/3/33/F1.svg"
            alt="F1 Logo"
            class="h-10 mx-auto mb-4"
          />
          <h1 class="text-3xl font-bold text-gray-100">Join The Grid</h1>
          <p class="text-gray-400 mt-1">Create your official F1 account</p>
        </div>

        <form onsubmit="return validform();" class="space-y-5">
          <!-- Error/Success Messages -->
          <div
            id="errorMessage"
            class="hidden p-3 rounded-lg bg-red-500/20 text-red-400 text-sm"
          ></div>
          <div
            id="successMessage"
            class="hidden p-3 rounded-lg bg-green-500/20 text-green-400 text-sm"
          ></div>

          <!-- Title & DOB -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label
                for="title"
                class="block text-sm font-semibold text-gray-400"
                >Title</label
              >
              <select
                id="title"
                class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
              >
                <option value="">Select</option>
                <option>Mr</option>
                <option>Mrs</option>
                <option>Ms</option>
                <option>Dr</option>
              </select>
            </div>
            <div>
              <label for="dob" class="block text-sm font-semibold text-gray-400"
                >Date of birth</label
              >
              <input
                id="dob"
                type="date"
                required
                class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
              />
            </div>
          </div>

          <!-- First & Last Name -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label
                for="firstName"
                class="block text-sm font-semibold text-gray-400"
                >First name</label
              >
              <input
                id="firstName"
                type="text"
                placeholder="First name"
                required
                class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
              />
            </div>
            <div>
              <label
                for="lastName"
                class="block text-sm font-semibold text-gray-400"
                >Last name</label
              >
              <input
                id="lastName"
                type="text"
                placeholder="Last name"
                required
                class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
              />
            </div>
          </div>
        </form>
      </div>
    </div>

    <script>
      // Set max date for DOB so users can't select a future date
      document.addEventListener("DOMContentLoaded", function () {
        const d = new Date();
        const yyyy = d.getFullYear();
        // getMonth() is 0-indexed (0=Jan, 11=Dec), so we add 1.
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");

        // FIXED: Use backticks (`) to create a template literal string
        const maxDate = `${yyyy}-${mm}-${dd}`;

        // Find the date input and set its 'max' attribute
        const dobInput = document.getElementById("dob");
        if (dobInput) {
          dobInput.setAttribute("max", maxDate);
        }
      });
    </script>
  </body>
</html>
