    <!-- Page container -->
    <div
      class="container mx-auto mt-9 px-4 py-12 flex justify-center min-h-screen items-center pt-24"
    >
      <!-- Card -->
      <div
        class="w-full max-w-lg bg-gray-800 border border-gray-700 shadow-2xl rounded-2xl p-6 sm:p-10 relative overflow-hidden"
      >
        <div class="absolute top-0 left-0 h-2 w-full bg-red-600"></div>

        <!-- Form Header -->
        <div class="text-center mb-8">
          <img
            src="https://upload.wikimedia.org/wikipedia/commons/3/33/F1.svg"
            alt="F1 Logo"
            class="h-10 mx-auto mb-4"
          />
          <h1 class="text-3xl font-bold text-gray-100">Join The Grid</h1>
          <p class="text-gray-400 mt-1">Create your official F1 account</p>
        </div>

        <form onsubmit="return validform();" class="space-y-5">
          <!-- Error/Success Messages -->
          <div
            id="errorMessage"
            class="hidden p-3 rounded-lg bg-red-500/20 text-red-400 text-sm"
          ></div>
          <div
            id="successMessage"
            class="hidden p-3 rounded-lg bg-green-500/20 text-green-400 text-sm"
          ></div>

          <!-- Title & DOB -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label
                for="title"
                class="block text-sm font-semibold text-gray-400"
                >Title</label
              >
              <select
                id="title"
                class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
              >
                <option value="">Select</option>
                <option>Mr</option>
                <option>Mrs</option>
                <option>Ms</option>
                <option>Dr</option>
              </select>
            </div>
            <div>
              <label for="dob" class="block text-sm font-semibold text-gray-400"
                >Date of birth</label
              >
              <input
                id="dob"
                type="date"
                required
                class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
              />
            </div>
          </div>

          <!-- First & Last Name -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
            <div>
              <label
                for="firstName"
                class="block text-sm font-semibold text-gray-400"
                >First name</label
              >
              <input
                id="firstName"
                type="text"
                placeholder="First name"
                required
                class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
              />
            </div>
            <div>
              <label
                for="lastName"
                class="block text-sm font-semibold text-gray-400"
                >Last name</label
              >
              <input
                id="lastName"
                type="text"
                placeholder="Last name"
                required
                class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
              />
            </div>
          </div>

          <!-- Country -->
          <div>
            <label
              for="country"
              class="block text-sm font-semibold text-gray-400"
              >Country of residence</label
            >
            <select
              id="country"
              required
              class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
            >
              <option value="">Select</option>
              <option>Nepal</option>
              <option>United Kingdom</option>
              <option>United States</option>
              <option>Other</option>
            </select>
          </div>

          <!-- Email -->
          <div>
            <label for="email" class="block text-sm font-semibold text-gray-400"
              >Email address</label
            >
            <input
              id="email"
              type="email"
              placeholder="you@example.com"
              required
              class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
            />
          </div>

          <!-- Password -->
          <div>
            <label
              for="password"
              class="block text-sm font-semibold text-gray-400"
              >Password</label
            >
            <input
              id="password"
              type="password"
              placeholder="••••••••"
              required
              class="mt-1 block w-full bg-gray-700 border-gray-600 text-gray-200 rounded-lg shadow-sm focus:ring-red-500 focus:border-red-500 transition"
            />
          </div>

          <!-- Marketing Checkbox -->
          <div class="flex items-center space-x-3 pt-2">
            <input
              id="marketing"
              type="checkbox"
              class="h-4 w-4 text-red-600 bg-gray-600 border-gray-500 rounded focus:ring-red-500"
            />
            <label for="marketing" class="text-sm text-gray-400"
              >I want to receive news and exclusive offers from F1</label
            >
          </div>

          <!-- Submit Button -->
          <div class="pt-4">
            <button
              type="submit"
              class="w-full py-3 px-4 bg-red-600 hover:bg-red-700 text-white font-bold rounded-lg shadow-md focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-gray-800 focus:ring-red-500 transition-colors uppercase tracking-wider"

              Create Account
            </button>

        </form>

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"

    <script>
      // Set max date for DOB input
      document.addEventListener("DOMContentLoaded", function () {
        const d = new Date();
        const yyyy = d.getFullYear();
        const mm = String(d.getMonth() + 1).padStart(2, "0");
        const dd = String(d.getDate()).padStart(2, "0");
        const maxDate = `${yyyy}-${mm}-${dd}`;
        const dobInput = document.getElementById("dob");
        if (dobInput) {
          dobInput.setAttribute("max", maxDate);
        }
      });

      // Form validation logic
      function validform() {
        const errorDiv = document.getElementById("errorMessage");
        const successDiv = document.getElementById("successMessage");
        const allInputs = document.querySelectorAll("input, select");

        errorDiv.classList.add("hidden");
        successDiv.classList.add("hidden");
        allInputs.forEach((input) => input.classList.remove("border-red-500"));

        function showError(message, fieldId) {
          errorDiv.innerText = message;
          errorDiv.classList.remove("hidden");
          if (fieldId) {
            document.getElementById(fieldId).classList.add("border-red-500");
            document.getElementById(fieldId).focus();
          }
        }

        const title = document.getElementById("title").value;
        const firstName = document.getElementById("firstName").value;
        const lastName = document.getElementById("lastName").value;
        const dob = document.getElementById("dob").value;
        const country = document.getElementById("country").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (
          !title ||
          !firstName ||
          !lastName ||
          !dob ||
          !country ||
          !email ||
          !password
        ) {
          showError("Please fill in all required fields.");
          return false;
        }

        const atIdx = email.indexOf("@");
        const emailLocal =
          atIdx === -1
            ? email.toLowerCase().trim()
            : email.slice(0, atIdx).toLowerCase().trim();
        const unameLower = firstName.toLowerCase().trim();

        if (unameLower === emailLocal) {
          showError(
            "Your first name should not be the same as your email.",
            "firstName"
          );
          return false;
        }

        if (password.length < 6) {
          showError("Password must be at least 6 characters long.", "password");
          return false;
        }

        successDiv.innerText =
          "Account created successfully! Welcome to the team.";
        successDiv.classList.remove("hidden");
        document.querySelector("form").reset();

        return false; // Prevents page reload
      }
    </script>
