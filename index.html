<!DOCTYPE html>
<html>
  <head>
    <title>F1 Navbar</title>
    <link rel="stylesheet" href="main.css" />

    <link href="./output.css" rel="stylesheet" />
  </head>
  <body>
    <nav class="bg-gray-900" x-data="{ isOpen: false } \">
      <div class="px-4 sm:px-6 lg:px-8">
        <div class="relative flex h-16 items-center justify-between w-100">
          <div class="flex flex-shrink-0 items-center">
            <a href="index.html">
              <img
                class="h-8 w-auto"
                src="https://upload.wikimedia.org/wikipedia/commons/3/33/F1.svg"
                alt="F1 Logo"
              />
            </a>
          </div>

          <div class="absolute inset-y-0 right-0 flex items-center lg:hidden">
            <button
              @click="isOpen = !isOpen"
              type="button"
              class="inline-flex items-center justify-center rounded-md p-2 text-gray-400 hover:bg-gray-700 hover:text-white focus:outline-none focus:ring-2 focus:ring-inset focus:ring-white"
              aria-controls="mobile-menu"
              aria-expanded="false"
            >
              <span class="sr-only">Open main menu</span>
              <svg
                x-show="!isOpen"
                class="block h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                />
              </svg>
              <svg
                x-show="isOpen"
                class="h-6 w-6"
                fill="none"
                viewBox="0 0 24 24"
                stroke-width="1.5"
                stroke="currentColor"
                aria-hidden="true"
              >
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  d="M6 18L18 6M6 6l12 12"
                />
              </svg>
            </button>
          </div>

          <div class="hidden lg:ml-6 lg:block">
            <div class="flex items-center space-x-4">
              <a
                href="index.html"
                class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                >Home</a
              >
              <a
                href="teams.html"
                class="rounded-md px-3 py-2 text-sm font-medium text-white bg-gray-800"
                aria-current="page"
                >Drivers & Teams</a
              >
              <a
                href="schedule.html"
                class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                >Schedule</a
              >
              <a
                href="leaderboard.html"
                class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                >Leader Boards</a
              >
              <a
                href="aboutUs.html"
                class="rounded-md px-3 py-2 text-sm font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
                >About us</a
              >
            </div>
          </div>
        </div>
      </div>

      <div x-show="isOpen" class="lg:hidden" id="mobile-menu">
        <div class="space-y-1 px-2 pb-3 pt-2">
          <a
            href="index.html"
            class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >Home</a
          >
          <a
            href="teams.html"
            class="block rounded-md bg-gray-800 px-3 py-2 text-base font-medium text-white"
            aria-current="page"
            >Drivers & Teams</a
          >
          <a
            href="schedule.html"
            class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >Schedule</a
          >
          <a
            href="leaderboard.html"
            class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >Leader board</a
          >
          <a
            href="aboutUs.html"
            class="block rounded-md px-3 py-2 text-base font-medium text-gray-300 hover:bg-gray-700 hover:text-white"
            >About us</a
          >
        </div>
      </div>
    </nav>
    <div class="video-section">video hunxa esma</div>

    <div class="highlight-section">
      <h2>Latest Highlight</h2>
      <div class="highlight-container"></div>
    </div>
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"
    ></script>
  </body>
</html>
